server:
  port: 8080

spring:
  application:
    name: order-management-system

datasource:
  url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:customer_db}
  username: ${DB_USER:postgres}
  password: ${DB_PASSWORD}
  driver-class-name: org.postgres.Driver

jpa:
  show-sql: true
  open-in-view: false
  hibernate:
    ddl-auto: update
  properties:
    hibernate:
      format_sql: true